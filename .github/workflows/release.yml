name: Build & Release Metadelta

on:
  pull_request:
  push:
    branches:
      - master
      - windows-compatibility-error
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compatibility:
    name: Compatibility (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Compile plugin
        run: npm run compile

      - name: Windows CLI smoke test
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $tarball = npm pack --ignore-scripts --silent
          sf plugins install ".\$tarball"
          sf plugins inspect @nervill/metadelta
          sf metadelta security users --help

  build-publish-and-release:
    needs: compatibility
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Align package version to tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "PKG_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Run tests
        run: npm test

      - name: Build (compile TypeScript)
        run: npm run compile

      - name: Remove node_modules before packaging
        run: rm -rf node_modules

      - name: Generate tarball
        run: |
          PKG=$(npm pack --ignore-scripts --silent | tail -n 1 | tr -d '\r')
          echo "TARBALL_NAME=$PKG" >> $GITHUB_ENV
          cp "$PKG" "metadelta-${PKG_VERSION}.tgz"
          echo "ALIAS_TARBALL_NAME=metadelta-${PKG_VERSION}.tgz" >> $GITHUB_ENV

      - name: Publish to npmjs
        run: npm publish "$TARBALL_NAME" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body: |
            ⚡ Auto Release para Metadelta
          files: |
            ${{ env.TARBALL_NAME }}
            ${{ env.ALIAS_TARBALL_NAME }}
